#!/usr/bin/env python
from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, bool_t, double_t

gen = ParameterGenerator()
filters = gen.add_group("Filter")
filters.add("enable_filter", bool_t, 0, "Enable all cloud filtering", False)
filters.add("enable_range_filter", bool_t, 0, "Crop XYZ in each lidar frame", True)
filters.add("enable_ground_filter", bool_t, 0, "Filter ground on the selected lidar inputs", True)
filters.add("max_range", double_t, 0, "Maximum absolute XYZ coordinate (m)", 3.0, 0.01, 50.0)
filters.add("ground_z_threshold", double_t, 0, "Minimum retained ground-filter Z (m)", 0.0, -20.0, 20.0)
filters.add("set_params_external_bounds", bool_t, 0, "Keep the parent-frame outer box", True)
filters.add("set_params_internal_bounds", bool_t, 0, "Remove the parent-frame inner box", True)

exit(gen.generate("pointcloud_fusion", "pointcloud_fusion", "Filter"))
