#!/usr/bin/env python
from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, double_t

gen = ParameterGenerator()
gen.add("x", double_t, 0, "Child-to-parent X translation (m)", 0.0, -0.5, 0.1)
gen.add("y", double_t, 0, "Child-to-parent Y translation (m)", 0.0, -0.35, 0.35)
gen.add("z", double_t, 0, "Child-to-parent Z translation (m)", 0.0, -0.3, 0.0)
for angle in ("roll", "pitch", "yaw"):
    gen.add(angle, double_t, 0, "Child-to-parent rotation (rad)", 0.0, -3.15, 3.15)

exit(gen.generate("pointcloud_fusion", "pointcloud_fusion", "Extrinsics"))
