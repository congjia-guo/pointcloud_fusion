#!/usr/bin/env python
from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, double_t

gen = ParameterGenerator()
for axis in ("x", "y", "z"):
    gen.add(axis, double_t, 0, "Child-to-parent translation (m)", 0.0, -100.0, 100.0)
for angle in ("roll", "pitch", "yaw"):
    gen.add(angle, double_t, 0, "Child-to-parent rotation (rad)", 0.0, -6.284, 6.284)

exit(gen.generate("pointcloud_fusion", "pointcloud_fusion", "Extrinsics"))
