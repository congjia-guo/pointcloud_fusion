#!/usr/bin/env python
from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, double_t

gen = ParameterGenerator()
for axis in ("x", "y", "z"):
    gen.add(axis + "_min", double_t, 0, "Minimum coordinate (m)", -50.0, -1000.0, 1000.0)
    gen.add(axis + "_max", double_t, 0, "Maximum coordinate (m)", 50.0, -1000.0, 1000.0)

exit(gen.generate("pointcloud_fusion", "pointcloud_fusion", "Bounds"))
