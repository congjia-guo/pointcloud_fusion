#!/usr/bin/env python
from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, double_t

gen = ParameterGenerator()
for axis, limit in (("x", 50.0), ("y", 50.0), ("z", 20.0)):
    gen.add(axis + "_min", double_t, 0, "Minimum coordinate (m)", -limit, -limit, limit)
    gen.add(axis + "_max", double_t, 0, "Maximum coordinate (m)", limit, -limit, limit)

exit(gen.generate("pointcloud_fusion", "pointcloud_fusion", "Bounds"))
